# الفحص الآلي: يعمل على كل دفع وكل طلب دمج.
# لا يُدمج شيء في main إلا إذا نجح هذا الفحص كاملاً.
name: CI

on:
  # كل دفع إلى أي فرع، وكل طلب دمج
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: الجودة والاختبارات
    runs-on: ubuntu-latest

    services:
      pgsql:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ejaz_testing
          POSTGRES_USER: ejaz
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ejaz -d ejaz_testing"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # قبل نسخ .env يقلع لارافيل (package:discover) بالإنتاج افتراضاً، فترفض حراسات الإنتاج المشغّلات الوهمية
      APP_ENV: testing
      DB_HOST: 127.0.0.1
      DB_USERNAME: ejaz
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@v7

      # قبل تنفيذ /bootstrap لا توجد ملفات القفل ولا أدوات الجودة؛ يتخطى الفحص بقية الخطوات
      - name: التحقق من اكتمال التأسيس
        id: boot
        run: |
          if [ -f composer.lock ] && [ -f package-lock.json ] && [ -f phpstan.neon ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::المشروع لم يُؤسس بعد بأمر /bootstrap — تُتخطى الفحوص"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: shivammathur/setup-php@v2
        if: steps.boot.outputs.ready == 'true'
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, redis, intl, gd, zip, bcmath, pcntl, exif
          coverage: none

      - uses: actions/setup-node@v7
        if: steps.boot.outputs.ready == 'true'
        with:
          node-version: '22'

      - name: Cache Composer
        if: steps.boot.outputs.ready == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - name: تثبيت المكتبات
        if: steps.boot.outputs.ready == 'true'
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          npm run build

      - name: تجهيز البيئة
        if: steps.boot.outputs.ready == 'true'
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: تدقيق المكتبات أمنياً
        if: steps.boot.outputs.ready == 'true'
        run: |
          composer audit
          npm audit --omit=dev --audit-level=high

      - name: تنسيق الشيفرة (Pint)
        if: steps.boot.outputs.ready == 'true'
        run: vendor/bin/pint --test

      - name: التحليل الثابت (Larastan)
        if: steps.boot.outputs.ready == 'true'
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: الاختبارات
        if: steps.boot.outputs.ready == 'true'
        run: php artisan test
