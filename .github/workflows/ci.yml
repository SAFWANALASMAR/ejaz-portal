# الفحص الآلي: يعمل على كل دفع وكل طلب دمج.
# لا يُدمج شيء في main إلا إذا نجح هذا الفحص كاملاً.
name: CI

on:
  # كل دفع إلى أي فرع، وكل طلب دمج
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # صور الخادم كما تُبنى (docs/security.md «تحديث PHP وnginx»)، بـ --pull فلا تُقبل طبقة قديمة من ذاكرة المشغّل:
  # PHP للتطوير والإنتاج على الرقعة 8.4.27 فأحدث ورفع تقدم الجلسة مطفأ، وnginx بالوسم الذي في Dockerfile
  # (فرع مستقر يتلقى الرقع) بـ nginx -t بلا تحذير ورؤوس الحماية حاضرة (tests/nginx/run.sh)
  php-image:
    name: صور الخادم (الرقع الأمنية)
    # لا شيفرة من نسخة (fork) ولا من Dependabot على المشغّل المحلي (docs/deploy/ci-runner.md «الأمن»)
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]'
    # متغير المستودع CI_RUNNER يوجّه الفحص إلى المشغّل المحلي (ejaz)، وبدونه ubuntu-latest (docs/deploy/ci-runner.md)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: بناء الصور
        run: |
          docker build --pull -t ejaz-php-dev docker/php
          docker build --pull --target base -t ejaz-php-base -f deploy/docker/Dockerfile .
          # صورة الإنتاج كاملة كما ينشرها scripts/deploy-compose.sh (المكتبات والواجهة وإعداد PHP منسوخ فيها)
          docker build --pull --target app -t ejaz-app -f deploy/docker/Dockerfile .

      - name: الإصدار ورفع تقدم الجلسة
        run: |
          check='if (version_compare(PHP_VERSION, "8.4.27", "<")) { fwrite(STDERR, "PHP ".PHP_VERSION." أقدم من 8.4.27\n"); exit(1); }
          if (filter_var(ini_get("session.upload_progress.enabled"), FILTER_VALIDATE_BOOLEAN)) { fwrite(STDERR, "session.upload_progress.enabled مفعّل\n"); exit(1); }
          echo "PHP ", PHP_VERSION, "، ورفع تقدم الجلسة مطفأ\n";'
          docker run --rm ejaz-php-dev php -r "$check"
          # إعداد الإنتاج كما تنسخه مرحلة app إلى الصورة
          docker run --rm -v "$PWD/deploy/php/production.ini:/usr/local/etc/php/conf.d/99-ejaz.ini:ro" ejaz-php-base php -r "$check"
          # والصورة المنشورة نفسها بإعدادها المنسوخ، بلا نقطة دخولها (تبني ذاكرة لارافيل وتحتاج القاعدة)
          docker run --rm --entrypoint php ejaz-app -r "$check"

      - name: nginx بإعداد الإنتاج
        run: |
          image="$(sed -n 's/^FROM \(nginx:[^ ]*\) AS web$/\1/p' deploy/docker/Dockerfile)"
          [ -n "$image" ] || { echo "::error::لا مرحلة web بصورة nginx في deploy/docker/Dockerfile"; exit 1; }
          docker pull -q "$image"
          bash tests/nginx/run.sh "$image"

  quality:
    name: الجودة والاختبارات
    # لا شيفرة من نسخة (fork) ولا من Dependabot على المشغّل المحلي (docs/deploy/ci-runner.md «الأمن»)
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]'
    # متغير المستودع CI_RUNNER يوجّه الفحص إلى المشغّل المحلي (ejaz)، وبدونه ubuntu-latest (docs/deploy/ci-runner.md)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    services:
      pgsql:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ejaz_testing
          POSTGRES_USER: ejaz
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ejaz -d ejaz_testing"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # قبل نسخ .env يقلع لارافيل (package:discover) بالإنتاج افتراضاً، فترفض حراسات الإنتاج المشغّلات الوهمية
      APP_ENV: testing
      DB_HOST: 127.0.0.1
      DB_USERNAME: ejaz
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # المشروع مؤسس: غياب ملف قفل أو إعداد التحليل يُفشل الفحص، ولا يُتخطى به شيء (الفحص الأمني 14 أكتوبر)
      - name: التحقق من اكتمال التأسيس
        run: |
          missing=0
          for file in composer.lock package-lock.json phpstan.neon; do
            if [ ! -f "$file" ]; then
              echo "::error::الملف $file غائب، ولا يُفحص المشروع بدونه"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      # سكربت تجهيز الخادم يُشغَّل بـ root مرة واحدة على خادم الإنتاج، فلا يدخل بتحذير واحد (shellcheck مثبّت في ubuntu-latest)
      - name: فحص سكربت تجهيز الخادم (shellcheck)
        run: shellcheck --severity=style scripts/server-bootstrap.sh

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        env:
          # على المشغّل المحلي يثبّت ما ينقص صورته ولا يفترض أدوات ubuntu-latest
          runner: ${{ vars.CI_RUNNER && 'self-hosted' || 'github-hosted' }}
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, redis, intl, gd, zip, bcmath, pcntl, exif
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Cache Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          # مجلد ذاكرة Composer على لينكس (XDG)، لا مجلد ~/.composer القديم
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}

      # بلا إضافات Composer ولا سكربتات تثبيت الحزم، فلا تعمل شيفرة مكتبة عند التثبيت على المشغّل. ثم سكربت المشروع
      # بعد التحميل صراحة (package:discover). والبناء لا يحتاج سكربتات npm (esbuild وrollup وoxide بحزمها الثنائية)
      - name: تثبيت المكتبات
        run: |
          composer install --no-interaction --prefer-dist --no-progress --no-plugins --no-scripts
          composer run-script post-autoload-dump
          npm ci --ignore-scripts
          npm run build

      - name: تجهيز البيئة
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: تدقيق المكتبات أمنياً
        run: |
          composer audit
          npm audit --omit=dev --audit-level=high

      # أدوات البناء والتطوير (Vite وغيرها) لا تصل إلى الإنتاج، لكن ثغراتها تمس جهاز المطوّر والفحص الآلي.
      # تقريرية غير مانعة: تظهر في السجل ولا توقف الفحص، والمانع ما قبلها لمكتبات الإنتاج.
      - name: تدقيق مكتبات الواجهة كاملة (تقريري)
        continue-on-error: true
        run: npm audit --audit-level=moderate

      - name: تنسيق الشيفرة (Pint)
        run: vendor/bin/pint --test

      - name: التحليل الثابت (Larastan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: الاختبارات
        run: php artisan test
