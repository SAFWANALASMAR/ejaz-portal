# عينة nginx لخادم التطبيق — بوابة جمعية إعجاز (docs/deploy.md)
# تُنسخ إلى /etc/nginx/sites-available/ejaz.conf وتُضبط فيها: النطاق، ومسار المشروع، وشهادة TLS، ومقبس PHP-FPM.
# خلف موزع أحمال يُنهي TLS: احذف كتلة 443 واستمع على 80 من عنوان الموزع وحده، واضبط TRUSTED_PROXIES بعنوانه.

# وحدات JavaScript بامتداد .mjs (عامل قارئ PDF في المكتبة: pdf.worker.min.mjs): لا يعرفها mime.types في صورة nginx، فتصل
# application/octet-stream مع nosniff، فيرفضها المتصفح لأن السكربت الوحدة يشترط نوع JavaScript، ولا تُضغط. ويضيفها هذا إلى
# أنواع http (types في سياق http يُلحق بما قبله، وفي server أو location يستبدله كله) — docs/reviews/2026-11-02-v0.15-perf.md
# ويُحذف السطر متى عرفت صورة nginx الامتداد بنفسها (nginx -t يحذّر حينها: duplicate extension)
types { application/javascript mjs; }

# رؤوس الحماية لما لا يمر بـ SecurityHeaders: ردود قبل وسائط المسار (405، وصفحة الصيانة 503، و400) وما يرده
# nginx نفسه (413). يُضاف الرأس متى غاب عن رد التطبيق وحده، والقيمة الفارغة لا يرسلها add_header، فلا يتكرر
# رأس يضعه التطبيق. ولا CSP بالرمز (nonce) من هنا: السياسة الثابتة تمنع التضمين والإضافات وتغيير base وحدها
map $upstream_http_x_frame_options $ejaz_x_frame_options { "" "DENY"; default ""; }
map $upstream_http_x_content_type_options $ejaz_x_content_type_options { "" "nosniff"; default ""; }
map $upstream_http_referrer_policy $ejaz_referrer_policy { "" "strict-origin-when-cross-origin"; default ""; }
map $upstream_http_permissions_policy $ejaz_permissions_policy { "" "camera=(), microphone=(), geolocation=(), payment=()"; default ""; }
map $upstream_http_cross_origin_opener_policy $ejaz_coop { "" "same-origin"; default ""; }
map $upstream_http_cross_origin_resource_policy $ejaz_corp { "" "same-origin"; default ""; }
map $upstream_http_strict_transport_security $ejaz_hsts { "" "max-age=31536000; includeSubDomains"; default ""; }
map $upstream_http_content_security_policy $ejaz_csp { "" "object-src 'none'; base-uri 'self'; frame-ancestors 'none'"; default ""; }

# معرض الشواهد: الرمز السري في مساره (/evidence/...) لا يُكتب في سجل الوصول، في كل كتلة server (docs/decisions.md — 30 أكتوبر 2026)
# ورمز استعادة كلمة المرور في مسار صفحتها (/reset-password/{token}) كذلك (docs/decisions/2026-11-06-deploy-readiness.md)
map $request_uri $ejaz_loggable { ~^/evidence/ 0; ~^/reset-password/ 0; default 1; }

# المنفذ 80: تحويل دائم إلى https
server {
    listen 80;
    listen [::]:80;
    server_name ejaz.sa www.ejaz.sa;
    access_log /var/log/nginx/access.log combined if=$ejaz_loggable;
    return 301 https://ejaz.sa$request_uri;
}

# www إلى النطاق الأساسي، فلا يصل التطبيقَ إلا مضيف APP_URL (trustHosts يرفض غيره أصلاً)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ejaz.sa;
    access_log /var/log/nginx/access.log combined if=$ejaz_loggable;
    ssl_certificate     /etc/ssl/ejaz/fullchain.pem;
    ssl_certificate_key /etc/ssl/ejaz/privkey.pem;
    return 301 https://ejaz.sa$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ejaz.sa;
    access_log /var/log/nginx/access.log combined if=$ejaz_loggable;

    root /var/www/ejaz/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/ssl/ejaz/fullchain.pem;
    ssl_certificate_key /etc/ssl/ejaz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;

    # حدود الرفع (roadmap.md): ملف الصوت في المكتبة حتى 25 ميجابايت وPDF حتى 20، ولا تقل عن 26M.
    # ويوافقها post_max_size في deploy/php/production.ini. وأجزاء مقاطع المسابقات (5 ميجابايت افتراضياً) دونها.
    client_max_body_size 32M;
    client_body_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # رؤوس الحماية لصفحات التطبيق يرسلها لارافيل (SecurityHeaders: CSP وX-Frame-Options وHSTS وغيرها)،
    # فلا تُكرَّر هنا على مسار PHP. وتُضاف أدناه للملفات الثابتة في كتلها لأنها لا تمر بلارافيل.
    # وما غاب عن الرد (ردود قبل وسائط المسار، و413 من nginx) من الخرائط أعلاه. تسري على الكتل التي لا add_header فيها وحدها
    add_header X-Frame-Options $ejaz_x_frame_options always;
    add_header X-Content-Type-Options $ejaz_x_content_type_options always;
    add_header Referrer-Policy $ejaz_referrer_policy always;
    add_header Permissions-Policy $ejaz_permissions_policy always;
    add_header Cross-Origin-Opener-Policy $ejaz_coop always;
    add_header Cross-Origin-Resource-Policy $ejaz_corp always;
    add_header Strict-Transport-Security $ejaz_hsts always;
    add_header Content-Security-Policy $ejaz_csp always;

    # ملفات الواجهة المبنية بأسماء فيها بصمتها: تخزين سنة
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
        try_files $uri =404;
    }

    # ملفات جذر public الثابتة (الأيقونة المفضلة وصورها، و/images): برؤوس الحماية نفسها، وإلا وصلت بلا nosniff
    # (فحص ZAP). بامتدادات الصور وحدها، فلا يقدّم ملف .php أو ملفاً مخفياً نصاً خاماً قبل كتل المنع
    location ~* ^/(favicon\.ico|favicon-32x32\.png|apple-touch-icon\.png|icon-192\.png|images/[^.][^?]*\.(svg|png|jpe?g|webp))$ {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
        try_files $uri =404;
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
        try_files $uri =404;
    }

    # صور المحتوى المنشور (القرص العام). لا يُنفَّذ فيها شيء، وأي ملف يُفتح فيها مباشرة يُعزل بسياسة
    # تمنع السكربت، حتى لو وصل إليها ملف غير متوقع
    location /storage/ {
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        location ~ \.php$ { return 404; }
        try_files $uri =404;
    }

    # robots.txt من لارافيل (مفتاح SEO_INDEXABLE): لا `location = /robots.txt` مستقلة بلا try_files،
    # ولا ملف public/robots.txt ثابت. وكذلك sitemap.xml (decisions.md)
    # والأيقونة المفضلة في كتلة ملفات الجذر الثابتة أعلاه، برؤوس الحماية

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP: نقطة الدخول وحدها، ولا يُنفَّذ أي ملف PHP آخر
    location = /index.php {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ \.php$ {
        return 404;
    }

    # الملفات المخفية (.env و.git) ممنوعة، عدا .well-known لشهادة TLS
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # (اختياري) تسليم الملفات الخاصة من nginx بـ X-Accel-Redirect بدل بثها من PHP، متى كان القرص الخاص
    # محلياً. لا يُفعَّل حتى يرسل التطبيق الرأس (خطة في docs/security/2026-10-10-security-audit.md).
    # وفي الإنتاج على تخزين S3 يُستعمل رابط تخزين موقّع قصير بدله.
    # location /_private/ {
    #     internal;
    #     alias /var/www/ejaz/storage/app/private/;
    # }
}
