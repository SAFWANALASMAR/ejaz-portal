# عينة nginx لخادم التطبيق — بوابة جمعية إعجاز (docs/deploy.md)
# تُنسخ إلى /etc/nginx/sites-available/ejaz.conf وتُضبط فيها: النطاق، ومسار المشروع، وشهادة TLS، ومقبس PHP-FPM.
# خلف موزع أحمال يُنهي TLS: احذف كتلة 443 واستمع على 80 من عنوان الموزع وحده، واضبط TRUSTED_PROXIES بعنوانه.

# المنفذ 80: تحويل دائم إلى https
server {
    listen 80;
    listen [::]:80;
    server_name ejaz.sa www.ejaz.sa;
    return 301 https://ejaz.sa$request_uri;
}

# www إلى النطاق الأساسي، فلا يصل التطبيقَ إلا مضيف APP_URL (trustHosts يرفض غيره أصلاً)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ejaz.sa;
    ssl_certificate     /etc/ssl/ejaz/fullchain.pem;
    ssl_certificate_key /etc/ssl/ejaz/privkey.pem;
    return 301 https://ejaz.sa$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ejaz.sa;

    root /var/www/ejaz/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/ssl/ejaz/fullchain.pem;
    ssl_certificate_key /etc/ssl/ejaz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;

    # حدود الرفع (roadmap.md): ملف الصوت في المكتبة حتى 25 ميجابايت وPDF حتى 20، ولا تقل عن 26M.
    # ويوافقها post_max_size في deploy/php/production.ini. وأجزاء مقاطع المسابقات (5 ميجابايت افتراضياً) دونها.
    client_max_body_size 32M;
    client_body_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # رؤوس الحماية لصفحات التطبيق يرسلها لارافيل (SecurityHeaders: CSP وX-Frame-Options وHSTS وغيرها)،
    # فلا تُكرَّر هنا على مسار PHP. وتُضاف أدناه للملفات الثابتة وحدها لأنها لا تمر بلارافيل.

    # ملفات الواجهة المبنية بأسماء فيها بصمتها: تخزين سنة
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
        try_files $uri =404;
    }

    # ملفات جذر public الثابتة (الأيقونة المفضلة وصورها، و/images): برؤوس الحماية نفسها، وإلا وصلت بلا nosniff
    # (فحص ZAP). وما لا ملف له يذهب إلى لارافيل (robots.txt وsitemap.xml منه)
    location ~* ^/(favicon\.ico|favicon-32x32\.png|apple-touch-icon\.png|icon-192\.png|images/) {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
        try_files $uri =404;
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
        try_files $uri =404;
    }

    # صور المحتوى المنشور (القرص العام). لا يُنفَّذ فيها شيء، وأي ملف يُفتح فيها مباشرة يُعزل بسياسة
    # تمنع السكربت، حتى لو وصل إليها ملف غير متوقع
    location /storage/ {
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        location ~ \.php$ { return 404; }
        try_files $uri =404;
    }

    # robots.txt من لارافيل (مفتاح SEO_INDEXABLE): لا `location = /robots.txt` مستقلة بلا try_files،
    # ولا ملف public/robots.txt ثابت. وكذلك sitemap.xml (decisions.md)
    # والأيقونة المفضلة في كتلة ملفات الجذر الثابتة أعلاه، برؤوس الحماية

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP: نقطة الدخول وحدها، ولا يُنفَّذ أي ملف PHP آخر
    location = /index.php {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ \.php$ {
        return 404;
    }

    # الملفات المخفية (.env و.git) ممنوعة، عدا .well-known لشهادة TLS
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # (اختياري) تسليم الملفات الخاصة من nginx بـ X-Accel-Redirect بدل بثها من PHP، متى كان القرص الخاص
    # محلياً. لا يُفعَّل حتى يرسل التطبيق الرأس (خطة في docs/security/2026-10-10-security-audit.md).
    # وفي الإنتاج على تخزين S3 يُستعمل رابط تخزين موقّع قصير بدله.
    # location /_private/ {
    #     internal;
    #     alias /var/www/ejaz/storage/app/private/;
    # }
}
