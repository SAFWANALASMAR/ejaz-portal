# nginx في حاوية الويب (deploy/compose.production.yaml) — نظير deploy/nginx/ejaz.conf للخادم بلا حاويات.
# قالب: صورة nginx تستبدل ${SITE_HOST} من البيئة عند بدء الحاوية (ejaz.sa في الإنتاج، ونطاق التجريبية فيها)،
# ولا تمس متغيرات nginx نفسها ($request_uri وغيرها) لأنها ليست متغيرات بيئة.
# النطاق SITE_HOST، والشهادة من مجلد الخادم /etc/ejaz/tls (fullchain.pem وprivkey.pem)، وتحدي ACME من /var/www/acme.
# خلف موزع أحمال يُنهي TLS: تُحذف كتلة 443 ويُكتفى بالمنفذ 80 من الموزع وحده، ويُضبط TRUSTED_PROXIES.

server_tokens off;
client_max_body_size 32M;
client_body_timeout 60s;
gzip on;
gzip_vary on;
gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

# رؤوس الحماية لما لا يمر بـ SecurityHeaders: ردود قبل وسائط المسار (405، وصفحة الصيانة 503، و400) وما يرده
# nginx نفسه (413). يُضاف الرأس متى غاب عن رد التطبيق وحده، والقيمة الفارغة لا يرسلها add_header، فلا يتكرر
# رأس يضعه التطبيق. ولا CSP بالرمز (nonce) من هنا: السياسة الثابتة تمنع التضمين والإضافات وتغيير base وحدها
map $upstream_http_x_frame_options $ejaz_x_frame_options { "" "DENY"; default ""; }
map $upstream_http_x_content_type_options $ejaz_x_content_type_options { "" "nosniff"; default ""; }
map $upstream_http_referrer_policy $ejaz_referrer_policy { "" "strict-origin-when-cross-origin"; default ""; }
map $upstream_http_permissions_policy $ejaz_permissions_policy { "" "camera=(), microphone=(), geolocation=(), payment=()"; default ""; }
map $upstream_http_cross_origin_opener_policy $ejaz_coop { "" "same-origin"; default ""; }
map $upstream_http_cross_origin_resource_policy $ejaz_corp { "" "same-origin"; default ""; }
map $upstream_http_strict_transport_security $ejaz_hsts { "" "max-age=31536000; includeSubDomains"; default ""; }
map $upstream_http_content_security_policy $ejaz_csp { "" "object-src 'none'; base-uri 'self'; frame-ancestors 'none'"; default ""; }

# معرض الشواهد: الرمز السري في مساره (/evidence/...) لا يُكتب في سجل الوصول، في كل كتلة server (docs/decisions.md — 30 أكتوبر 2026)
map $request_uri $ejaz_loggable { ~^/evidence/ 0; default 1; }

upstream ejaz_app {
    server app:9000;
}

server {
    listen 80;
    listen [::]:80;
    server_name ${SITE_HOST} www.${SITE_HOST};
    access_log /var/log/nginx/access.log main if=$ejaz_loggable;

    # فحص صحة الحاوية نفسها، من داخلها وحده
    location = /nginx-health {
        access_log off;
        allow 127.0.0.1;
        deny all;
        return 200 "ok\n";
    }

    # تجديد الشهادة بتحدي HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://${SITE_HOST}$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.${SITE_HOST};
    access_log /var/log/nginx/access.log main if=$ejaz_loggable;
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    return 301 https://${SITE_HOST}$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${SITE_HOST};
    access_log /var/log/nginx/access.log main if=$ejaz_loggable;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # رؤوس الحماية لصفحات التطبيق من لارافيل (SecurityHeaders)، وللملفات الثابتة في كتلها. وما غاب عن الرد
    # (ردود قبل وسائط المسار، و413 من nginx) من الخرائط أعلاه. تسري على الكتل التي لا add_header فيها وحدها
    add_header X-Frame-Options $ejaz_x_frame_options always;
    add_header X-Content-Type-Options $ejaz_x_content_type_options always;
    add_header Referrer-Policy $ejaz_referrer_policy always;
    add_header Permissions-Policy $ejaz_permissions_policy always;
    add_header Cross-Origin-Opener-Policy $ejaz_coop always;
    add_header Cross-Origin-Resource-Policy $ejaz_corp always;
    add_header Strict-Transport-Security $ejaz_hsts always;
    add_header Content-Security-Policy $ejaz_csp always;

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
        try_files $uri =404;
    }

    # ملفات جذر public الثابتة (الأيقونة المفضلة وصورها، و/images): برؤوس الحماية نفسها، وإلا وصلت بلا nosniff
    # (فحص ZAP). بامتدادات الصور وحدها، فلا يقدّم ملف .php أو ملفاً مخفياً نصاً خاماً قبل كتل المنع
    location ~* ^/(favicon\.ico|favicon-32x32\.png|apple-touch-icon\.png|icon-192\.png|images/[^.][^?]*\.(svg|png|jpe?g|webp))$ {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
        try_files $uri =404;
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
        try_files $uri =404;
    }

    # القرص العام من مجلد التخزين المشترك (للقراءة)، معزولاً بسياسة تمنع السكربت
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        location ~ \.php$ { return 404; }
    }

    # robots.txt وsitemap.xml من لارافيل: لا location مستقلة بلا try_files
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP في حاوية التطبيق: نقطة الدخول وحدها
    location = /index.php {
        fastcgi_pass ejaz_app;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
