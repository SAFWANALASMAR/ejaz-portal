# nginx في حاوية الويب (deploy/compose.production.yaml) — نظير deploy/nginx/ejaz.conf للخادم بلا حاويات.
# النطاق ejaz.sa، والشهادة من مجلد الخادم /etc/ejaz/tls (fullchain.pem وprivkey.pem)، وتحدي ACME من /var/www/acme.
# خلف موزع أحمال يُنهي TLS: تُحذف كتلة 443 ويُكتفى بالمنفذ 80 من الموزع وحده، ويُضبط TRUSTED_PROXIES.

server_tokens off;
client_max_body_size 32M;
client_body_timeout 60s;
gzip on;
gzip_vary on;
gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

upstream ejaz_app {
    server app:9000;
}

server {
    listen 80;
    listen [::]:80;
    server_name ejaz.sa www.ejaz.sa;

    # فحص صحة الحاوية نفسها، من داخلها وحده
    location = /nginx-health {
        access_log off;
        allow 127.0.0.1;
        deny all;
        return 200 "ok\n";
    }

    # تجديد الشهادة بتحدي HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://ejaz.sa$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ejaz.sa;
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    return 301 https://ejaz.sa$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ejaz.sa;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # رؤوس الحماية لصفحات التطبيق من لارافيل (SecurityHeaders)، وللملفات الثابتة هنا

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
        try_files $uri =404;
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
        try_files $uri =404;
    }

    # القرص العام من مجلد التخزين المشترك (للقراءة)، معزولاً بسياسة تمنع السكربت
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        location ~ \.php$ { return 404; }
    }

    # robots.txt وsitemap.xml من لارافيل: لا location مستقلة بلا try_files
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP في حاوية التطبيق: نقطة الدخول وحدها
    location = /index.php {
        fastcgi_pass ejaz_app;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
