; مجموعة PHP-FPM في حاوية التطبيق — بوابة جمعية إعجاز
; العدد من FPM_MAX_CHILDREN (docs/deploy/provider-checklist.md: نحو 60 ميجابايت للعملية، وذاكرة الخادم بعد القاعدة وRedis)
[www]
listen = 9000
pm = dynamic
pm.max_children = ${FPM_MAX_CHILDREN}
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 16
pm.max_requests = 1000
; فحص الصحة من الحاوية نفسها (healthcheck في compose)
ping.path = /fpm-ping
ping.response = pong
; سجل الطلبات البطيئة لتشخيص الذروة
request_slowlog_timeout = 5s
slowlog = /proc/self/fd/2
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
