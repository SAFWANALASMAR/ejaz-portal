# Redis 7 على خادم مستقل — بوابة جمعية إعجاز (docs/deploy.md «الذاكرة المؤقتة»).
# لا يلزم إن اختيرت ذاكرة مُدارة (مثل OCI Cache): تُضبط فيها القيم نفسها من لوحة المزود.
# يُضاف إلى /etc/redis/redis.conf أو يُضمَّن بـ include.

# الشبكة الخاصة وحدها، ولا منفذ عام
bind 127.0.0.1 <العنوان الخاص للخادم>
protected-mode yes
port 6379

# كلمة المرور من مخزن الأسرار، وتطابق REDIS_PASSWORD في .env
requirepass <من مخزن الأسرار>

# الذاكرة: لا allkeys-*، لأن قفل الدخول وحدود الرسائل وإصدار ذاكرة المحتوى مفاتيح بلا مدة (performance.md)
maxmemory <نحو 75% من ذاكرة الخادم>
maxmemory-policy volatile-lru

# الطوابير والجلسات تستحق البقاء بعد إعادة التشغيل
appendonly yes
appendfsync everysec

# أوامر خطرة لا يحتاجها التطبيق
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command DEBUG ""
