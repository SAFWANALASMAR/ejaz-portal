; قيم PHP للإنتاج والتجريبية — بوابة جمعية إعجاز (docs/deploy.md، docs/security.md)
; تُنسخ إلى /etc/php/8.4/fpm/conf.d/99-ejaz.ini و/etc/php/8.4/cli/conf.d/99-ejaz.ini

; لا تفاصيل تقنية للزائر
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

; آثار الأخطاء بلا قيم المعاملات، فلا يصل رأس Authorization بمفتاح بوابة الدفع ولا كلمة مرور إلى السجل
zend.exception_ignore_args = On
zend.exception_string_param_max_len = 0

; الذاكرة كالمحلي: فحص PDF يقرأ الملف كاملاً مرتين ويفك ضغط تدفقاته حتى 50 ميجابايت (roadmap.md)
memory_limit = 512M

; حدود الرفع لا تقل عن 26M (الصوت 25 وPDF 20)، ويوافقها client_max_body_size في nginx
upload_max_filesize = 32M
post_max_size = 32M
max_file_uploads = 20
max_execution_time = 60
max_input_time = 60
max_input_vars = 3000

; التواريخ تُخزَّن بتوقيت UTC وتُعرض بتوقيت الرياض من التطبيق (architecture.md)
date.timezone = UTC

; لا تفسير لمسارات PHP غير الموجودة
cgi.fix_pathinfo = 0

; الجلسات في Redis من لارافيل، وهذه للاحتياط
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax

; OPcache: لا فحص لتغيّر الملفات، فيعيد سكربت النشر تحميل PHP-FPM بعد كل نشر
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
opcache.validate_timestamps = 0
opcache.save_comments = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 600
