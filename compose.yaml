# بيئة التطوير المحلية لبوابة جمعية إعجاز
# التشغيل: docker compose up -d   ثم افتح http://localhost:8000

x-php: &php
  build:
    context: ./docker/php
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: ejaz-php:dev
  volumes:
    - .:/var/www/html
    # المكتبات والقوالب المترجمة على قرص لينكس داخل Docker لا على قرص ويندوز المشترك،
    # فالقراءة منه أسرع بكثير (انظر docs/decisions.md)
    - vendor:/var/www/html/vendor
  environment:
    VIEW_COMPILED_PATH: /tmp/ejaz-views
  depends_on:
    pgsql:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *php
    command: php artisan serve --host=0.0.0.0 --port=8000
    environment:
      VIEW_COMPILED_PATH: /tmp/ejaz-views
      # أكثر من طلب في الوقت نفسه (لوحة الإدارة واختبارات المتصفح)
      PHP_CLI_SERVER_WORKERS: 4
    # كل المنافذ على هذا الجهاز وحده، فلا تصلها أجهزة الشبكة المحلية (APP_PORT رقم المنفذ وحده)
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"

  queue:
    <<: *php
    # Horizon يدير عمال الطوابير ولوحة مراقبتها على /horizon (للمشرف العام فقط)
    command: php artisan horizon

  scheduler:
    <<: *php
    # المهام المجدولة في routes/console.php، ومنها مسح سجل العمليات بعد مدة الاحتفاظ
    command: php artisan schedule:work

  vite:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      # سمة لوحة الإدارة تستورد CSS من Filament في vendor (resources/css/filament/admin/theme.css)
      - vendor:/app/vendor:ro
    environment:
      CHOKIDAR_USEPOLLING: "${VITE_POLLING:-false}"
    command: sh -c "npm install && npm run dev"
    ports:
      - "127.0.0.1:${VITE_PORT:-5173}:5173"
    restart: unless-stopped

  # اختبارات المتصفح ولقطات الشاشات (tests/browser/README.md). لا تعمل تلقائياً:
  # docker compose run --rm browser
  browser:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: [tools]
    working_dir: /work
    volumes:
      - .:/work
      - node_modules:/work/node_modules
    environment:
      APP_PORT: ${APP_PORT:-8000}
    ipc: host
    depends_on:
      - app
      - vite
    command: npx playwright test --config=tests/browser/playwright.config.mjs

  pgsql:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ejaz}
      POSTGRES_USER: ${DB_USERNAME:-ejaz}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql:ro
    # على هذا الجهاز وحده: القاعدة بكلمة مرور افتراضية في التطوير
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ejaz} -d ${DB_DATABASE:-ejaz}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # بكلمة مرور حتى في التطوير: REDIS_PASSWORD في .env (يولّدها scripts/setup.sh)
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required in .env - run scripts/setup.sh}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:${FORWARD_MAILPIT_PORT:-1025}:1025"
      - "127.0.0.1:${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  pgdata:
  node_modules:
  vendor:
